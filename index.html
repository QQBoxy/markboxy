<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#eef2f4"/><title>Markboxy</title><link rel="stylesheet" href="/src/style.css"/></head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-arrow" viewBox="0 0 32 32"><path fill="currentColor" transform="scale(.1)"/></symbol>
<symbol id="i-ellipse" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="16" rx="11" ry="8"/></g></symbol>
<symbol id="i-rounded" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="20" height="20" rx="5"/></g></symbol>
<symbol id="i-line" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M7 25 25 7"/></g></symbol>
<symbol id="i-shape" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="20" height="20" rx="1"/></g></symbol>
<symbol id="i-pen" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m6 20-1 7 7-1L26 12a3.5 3.5 0 0 0-6-6ZM18 8l6 6M6 20l6 6"/></g></symbol>
<symbol id="i-text" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V6h18v3M16 6v20M11 26h10"/></g></symbol>
<symbol id="i-highlighter" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m8 18 10-12 8 7-10 12ZM8 18l8 7M9 19l-4 7h8l2-2M5 29h22"/></g></symbol>
<symbol id="i-stamp" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M6 23h20v4H6ZM9 23v-4c0-3 4-3 4-6V9a3 3 0 0 1 6 0v4c0 3 4 3 4 6v4"/></g></symbol>
<symbol id="i-crop" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4v18h18M4 10h18v18"/></g></symbol>
<symbol id="i-size" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="11"/><path d="M11 21 21 11" style="stroke-width:var(--size-weight,2)"/></g></symbol>
<symbol id="i-pin" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10M13 5v8l-5 6v2h16v-2l-5-6V5M16 21v7"/></g></symbol>
<symbol id="i-share" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V5m-6 6 6-6 6 6M7 17v10h18V17"/></g></symbol>
<symbol id="i-trash" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h22M12 9V5h8v4M8 9l1 18h14l1-18M13 14v8m6-8v8"/></g></symbol>
<symbol id="i-file" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5h12l6 6v16H7ZM19 5v7h6"/></g></symbol>
<symbol id="i-folder" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13V7h9l3 3h10v4M5 13h23l-4 13H5Z"/></g></symbol>
<symbol id="i-capture" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6H6v5m15-5h5v5M6 21v5h5m10 0h5v-5"/><rect x="11" y="11" width="10" height="10" rx="1"/></g></symbol>
<symbol id="i-fullscreen" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="6" width="22" height="17" rx="2"/><path d="M12 27h8m-4-4v4"/></g></symbol>
<symbol id="i-timer" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="18" r="10"/><path d="M13 4h6m-3 0v4m8 2 2-2M16 12v6l4 2"/></g></symbol>
<symbol id="i-save" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h17l4 4v18H6ZM11 5v8h11V5M11 27v-9h11v9M18 8v2"/></g></symbol>
<symbol id="i-chevron" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m10 13 6 6 6-6"/></g></symbol>
<symbol id="i-close" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m9 9 14 14M23 9 9 23"/></g></symbol>
<symbol id="i-check" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m7 16 6 6L25 10"/></g></symbol>
<symbol id="i-plus" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8v16M8 16h16"/></g></symbol>
<symbol id="i-grip" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h16M8 16h16M8 22h16"/></g></symbol>
</defs></svg>
<header class="topbar" aria-label="主工具列">
<div class="capture"><button id="capture" aria-label="螢幕速拍選單" aria-expanded="false"><svg aria-hidden="true"><use href="#i-capture"/></svg><span>螢幕速拍</span><b><svg aria-hidden="true"><use href="#i-chevron"/></svg></b></button>
<div id="capture-menu" class="capture-menu" hidden><button id="capture-screen" disabled title="擷取主螢幕的完整畫面"><svg aria-hidden="true"><use href="#i-fullscreen"/></svg>全螢幕</button><button id="capture-region" disabled><svg aria-hidden="true"><use href="#i-capture"/></svg>螢幕速拍...</button><button disabled><svg aria-hidden="true"><use href="#i-timer"/></svg>定時螢幕速拍...</button><button id="open-image"><svg aria-hidden="true"><use href="#i-folder"/></svg>開啟影像檔...</button><button id="save-project"><svg aria-hidden="true"><use href="#i-save"/></svg>儲存可編輯文件…</button><button id="blank"><svg aria-hidden="true"><use href="#i-file"/></svg>空白</button></div></div>
<div class="top-actions"><button id="share" title="匯出 PNG…" aria-label="匯出 PNG"><svg aria-hidden="true"><use href="#i-share"/></svg></button><span></span><button id="trash" title="清除畫布（可以復原）" aria-label="清除畫布"><svg aria-hidden="true"><use href="#i-trash"/></svg></button></div>
</header>
<main id="editor" aria-label="圖片標註編輯器">
<aside class="rail" aria-label="標註工具列"><div class="rail-content">
<div id="tools">
<button id="arrow-tool" data-tool="arrow" class="tool selected" aria-label="箭頭工具" aria-pressed="true" title="在影像中加入箭頭"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
<button id="text-tool" data-tool="text" class="tool text-tool" aria-label="文字工具" aria-pressed="false" title="在影像中新增文字；雙擊文字可重新編輯"><svg aria-hidden="true"><use href="#i-text"/></svg></button>
<button id="shape-tool" class="tool sub" aria-label="圖形工具" aria-expanded="false" aria-pressed="false"><svg aria-hidden="true"><use href="#i-shape"/></svg><svg class="sub-indicator" aria-hidden="true"><use href="#i-chevron"/></svg></button>
<button id="pen-tool" class="tool sub" aria-label="繪圖工具" aria-expanded="false" aria-pressed="false" title="標記與反白工具"><svg aria-hidden="true"><use href="#i-pen"/></svg><svg class="sub-indicator" aria-hidden="true"><use href="#i-chevron"/></svg></button>
<button class="tool sub" disabled aria-label="圖章工具（尚未實作）"><svg aria-hidden="true"><use href="#i-stamp"/></svg><svg class="sub-indicator" aria-hidden="true"><use href="#i-chevron"/></svg></button>
<button class="tool" id="crop-tool" aria-label="裁切工具" aria-pressed="false"><svg aria-hidden="true"><use href="#i-crop"/></svg></button>
<div class="rail-divider"></div>
<button id="color-toggle" class="tool sub" aria-label="色彩" aria-expanded="false" title="色彩"><span id="current-color" class="swatch"></span><svg class="sub-indicator" aria-hidden="true"><use href="#i-chevron"/></svg></button>
<button id="size-toggle" class="tool sub" style="--size-weight:2" aria-label="大小" aria-expanded="false" title="大小"><svg aria-hidden="true"><use href="#i-size"/></svg><svg class="sub-indicator" aria-hidden="true"><use href="#i-chevron"/></svg></button>
</div>
<div id="shape-panel" class="palette" hidden aria-label="圖形選單"><button class="tool pin" aria-label="釘選圖形選單" aria-pressed="false"><svg aria-hidden="true"><use href="#i-pin"/></svg></button><div class="size-gap"></div><button class="tool" data-tool="rectangle" aria-label="矩形"><svg aria-hidden="true"><use href="#i-shape"/></svg></button><button class="tool" data-tool="roundedRectangle" aria-label="圓角矩形"><svg aria-hidden="true"><use href="#i-rounded"/></svg></button><button class="tool" data-tool="ellipse" aria-label="橢圓形"><svg aria-hidden="true"><use href="#i-ellipse"/></svg></button><button class="tool" data-tool="line" aria-label="直線"><svg aria-hidden="true"><use href="#i-line"/></svg></button></div>
<div id="pen-panel" class="palette" hidden aria-label="繪圖選單"><button class="tool pin" aria-label="釘選繪圖選單" aria-pressed="false"><svg aria-hidden="true"><use href="#i-pin"/></svg></button><div class="pen-gap"></div><button class="tool" data-tool="pen" aria-label="標記"><svg aria-hidden="true"><use href="#i-pen"/></svg></button><button class="tool" data-tool="highlighter" aria-label="反白工具"><svg aria-hidden="true"><use href="#i-highlighter"/></svg></button></div>
<div id="color-panel" class="palette" hidden aria-label="色盤"><button class="tool pin" aria-label="釘選色盤" aria-pressed="false" title="開啟圖釘工具"><svg aria-hidden="true"><use href="#i-pin"/></svg></button>
<button class="tool" data-color="#ff2600" aria-label="紅色"><span class="swatch" style="--swatch:#ff2600"></span></button>
<button class="tool" data-color="#ff9300" aria-label="橘色"><span class="swatch" style="--swatch:#ff9300"></span></button>
<button class="tool" data-color="#fffb00" aria-label="黃色"><span class="swatch" style="--swatch:#fffb00"></span></button>
<button class="tool" data-color="#00d500" aria-label="綠色"><span class="swatch" style="--swatch:#00d500"></span></button>
<button class="tool" data-color="#1e90ff" aria-label="藍色"><span class="swatch" style="--swatch:#1e90ff"></span></button>
<button class="tool" data-color="#f52980" aria-label="粉紅色"><span class="swatch" style="--swatch:#f52980"></span></button>
<button class="tool" data-color="#ffffff" aria-label="白色"><span class="swatch" style="--swatch:#fff"></span></button>
<button class="tool" data-color="#000000" aria-label="黑色"><span class="swatch" style="--swatch:#000"></span></button>
<label class="tool custom-color" title="自訂色彩"><span class="swatch rainbow"></span><input id="color" type="color" aria-label="自訂色彩"/></label>
</div>
<div id="size-panel" class="palette" hidden aria-label="五級尺寸"><button class="tool pin" aria-label="釘選尺寸" aria-pressed="false" title="開啟圖釘工具"><svg aria-hidden="true"><use href="#i-pin"/></svg></button><div class="size-gap"></div>
<button class="tool" data-size="8.977159880834161" data-size-level="1" aria-label="最小尺寸"><span class="size-stroke" style="--weight:1px"></span></button><button class="tool" data-size="17.954319761668323" data-size-level="2" aria-label="小尺寸"><span class="size-stroke" style="--weight:2px"></span></button><button class="tool" data-size="26.931479642502484" data-size-level="3" aria-label="中尺寸"><span class="size-stroke" style="--weight:3px"></span></button><button class="tool" data-size="35.908639523336646" data-size-level="4" aria-label="大尺寸"><span class="size-stroke" style="--weight:4px"></span></button><button class="tool" data-size="58.35153922542205" data-size-level="5" aria-label="最大尺寸"><span class="size-stroke" style="--weight:5px"></span></button>
</div></div></aside>
<input id="open-file" hidden type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg,.markboxy"/>
<div id="arrow-menu" popover="manual" aria-label="標註操作"><button id="delete-arrow" type="button">刪除</button></div>
<div id="crop-bar" hidden><svg aria-hidden="true"><use href="#i-crop"/></svg><div class="crop-dimensions"><input id="crop-width" aria-label="裁切寬度" type="number" min="1" max="4096"/><span aria-hidden="true">×</span><input id="crop-height" aria-label="裁切高度" type="number" min="1" max="4096"/></div><div class="crop-actions"><button id="crop-cancel"><svg aria-hidden="true"><use href="#i-close"/></svg>取消</button><button id="crop-apply"><svg aria-hidden="true"><use href="#i-check"/></svg>套用</button></div></div><div id="workspace" class="workspace"><div id="stage" class="stage"><canvas id="canvas" width="1130" height="732" tabindex="0" aria-label="標註畫布：文字工具點一下新增、雙擊文字編輯；畫筆連續書寫定為同組；空白處拖曳新增目前工具的標註；點選或拖曳標註移動；長按開啟刪除選單；拖曳圓點調整；空白鍵加拖曳平移；Delete 刪除；Escape 取消。">請使用支援 Canvas 的瀏覽器。</canvas><textarea id="text-editor" hidden aria-label="編輯標註文字" maxlength="10000" spellcheck="false"></textarea><button class="extend up" disabled aria-label="向上延展畫布（尚未實作）"><svg aria-hidden="true"><use href="#i-plus"/></svg></button><button class="extend right" disabled aria-label="向右延展畫布（尚未實作）"><svg aria-hidden="true"><use href="#i-plus"/></svg></button><button class="extend down" disabled aria-label="向下延展畫布（尚未實作）"><svg aria-hidden="true"><use href="#i-plus"/></svg></button><button class="extend left" disabled aria-label="向左延展畫布（尚未實作）"><svg aria-hidden="true"><use href="#i-plus"/></svg></button></div></div>
</main>
<footer class="bottom-bar"><div class="document-controls"><div class="footer-control"><button id="zoom" aria-label="縮放比例" aria-expanded="false">100%<svg class="chevron" aria-hidden="true"><use href="#i-chevron"/></svg></button><div id="zoom-menu" class="bottom-menu" hidden aria-label="縮放選單"><button data-zoom="fit">符合視窗</button><button data-zoom="0.5">50%</button><button data-zoom="1">100%</button><button data-zoom="1.5">150%</button><button data-zoom="2">200%</button></div></div><input id="name" aria-label="文件名稱" value="空白" maxlength="100" spellcheck="false"/><div class="footer-control"><button id="format" aria-label="輸出格式" aria-expanded="false">.png<svg class="chevron" aria-hidden="true"><use href="#i-chevron"/></svg></button><div id="format-menu" class="bottom-menu" hidden aria-label="格式選單"><button data-format="png" aria-pressed="true"><svg aria-hidden="true"><use href="#i-check"/></svg><span>PNG</span></button><button data-format="jpeg"><svg aria-hidden="true"><use href="#i-check"/></svg><span>JPG</span></button></div></div></div>
<button id="export" class="export-tray" draggable="true" aria-label="匯出或拖出 PNG" title="點一下匯出 PNG；也可拖出圖片"><svg class="grip" aria-hidden="true"><use href="#i-grip"/></svg><span class="png-file"><svg aria-hidden="true"><use href="#i-file"/></svg><b>PNG</b></span><svg class="grip" aria-hidden="true"><use href="#i-grip"/></svg></button><span id="dimensions">1130 x 732</span></footer>
<div id="notification" hidden><p id="status" role="status" aria-live="polite"></p><a id="download" hidden download="空白.png">再次下載 PNG</a><button id="close-notification" aria-label="關閉通知"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
<dialog id="export-dialog"><form id="export-form"><h2>匯出</h2><label>名稱：<input id="export-name" required maxlength="100" value="空白"/></label><label>格式：<select id="export-format" aria-label="匯出格式"><option value="png">PNG</option><option value="jpeg">JPG</option></select></label><label id="quality-label" hidden>品質：<input id="quality" type="range" min="10" max="100" value="92"/></label><p>1130 × 732 像素</p><div class="dialog-actions"><button id="cancel-export" type="button">取消</button><button class="default" type="submit">匯出</button></div></form></dialog>
<script type="module" src="/src/main.ts"></script>
</body></html>
